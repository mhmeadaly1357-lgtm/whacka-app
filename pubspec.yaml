name: whacka_app
description: تطبيق مذكرات صوتية ذكي مع دعم الذكاء الاصطناعي العاطفي
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  firebase_core: ^2.24.0
  cloud_firestore: ^4.14.0
  firebase_auth: ^4.15.0
  firebase_storage: ^11.5.0
  speech_to_text: ^6.4.0
  permission_handler: ^11.4.4
  http: ^1.1.0
  dio: ^5.3.0
  intl: ^0.19.0
  provider: ^6.1.0
  uuid: ^4.0.0
  audio_waveforms: ^1.0.9
  flutter_tts: ^0.1.3
  google_fonts: ^6.1.0
  shimmer: ^3.0.0
  animations: ^2.0.11
  lottie: ^2.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/animations/
    - assets/images/
    - assets/sounds/

  fonts:
    - family: Almarai
      fonts:
        - asset: assets/fonts/Almarai-Light.ttf
          weight: 300
        - asset: assets/fonts/Almarai-Regular.ttf
          weight: 400
        - asset: assets/fonts/Almarai-Bold.ttf
          weight: 700
